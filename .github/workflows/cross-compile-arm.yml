# Inactif : GitHub Actions coupé le 12/11/2026 ; équivalent local : controles_locaux.py
name: ARM Cross-compilation CI

on:
  push:
    branches:
    - master
    - usbaudio-async-01

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v1
    - name: Install toolchain
      run: sudo apt-get -y install gcc-arm-none-eabi
    - name: Build binary
      run: make
